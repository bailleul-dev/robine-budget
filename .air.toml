root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/server ./backend/cmd/server"
entrypoint = "./tmp/server"
include_ext = ["go"]
exclude_dir = ["tmp", "vendor", "mobile"]
delay = 200
stop_on_error = true

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
